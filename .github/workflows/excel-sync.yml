name: Excel to GitHub Issues Sync

on:
  repository_dispatch:
    types: [excel_sync]

permissions:
  issues: write
  contents: read

jobs:
  create_issue:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const payload = context.payload.client_payload;

            const title = payload.title || "Untitled Task";

            const body = `
            Task ID: ${payload.task_id || "N/A"}
            Owner: ${payload.owner || "N/A"}
            Status: ${payload.status || "N/A"}
            Start Date: ${payload.start_date || "N/A"}
            ETA: ${payload.eta || "N/A"}
            Last Updated: ${payload.last_updated || "N/A"}

            Description:
            ${payload.description || "No description provided"}
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body
            });
